<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; src: url("../../assets/fonts/archivo-latin-wdth-normal.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "Archivo"; src: url("../../assets/fonts/archivo-latin-ext-wdth-normal.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; unicode-range: U+0100-024F, U+1E00-1EFF, U+2C60-2C7F, U+A720-A7FF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: "Archivo", Arial, sans-serif; color: #eeede8; background: #2a2b29; position: relative; -webkit-font-smoothing: antialiased; }
  .bg { position: absolute; left: -120px; top: -420px; width: 1320px; height: 2334px; object-fit: cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,20,19,.6) 0%, rgba(20,20,19,0) 20%, rgba(20,20,19,0) 32%, rgba(20,20,19,.82) 46%, rgba(20,20,19,.95) 100%); }
  .brand { position: absolute; left: 80px; top: 220px; display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 32px; letter-spacing: .24em; text-shadow: 0 1px 12px rgba(0,0,0,.5); }
  .brand i { display: grid; grid-template-columns: repeat(2, 10px); gap: 6px; }
  .brand i b { width: 10px; height: 10px; border-radius: 50%; background: #de5346; }
  .txt { position: absolute; left: 80px; right: 80px; bottom: 300px; display: flex; flex-direction: column; gap: 34px; }
  .kicker { font-size: 36px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #ef7a6e; }
  h1 { font-size: 108px; line-height: .96; font-weight: 800; font-stretch: 110%; letter-spacing: -.02em; }
  p { font-size: 44px; line-height: 1.3; color: #d9d8d1; max-width: 24ch; }
  p b { color: #eeede8; }
  .link { align-self: flex-start; display: flex; align-items: center; gap: 22px; background: #de5346; color: #121211; font-size: 56px; font-weight: 800; padding: 26px 40px; border-radius: 8px; margin-top: 10px; }
  .hint { font-size: 34px; font-weight: 600; color: #eeede8; opacity: .85; }
</style></head>
<body>
  <img class="bg" src="../photos/appel-fraises-vertical.png" alt="">
  <div class="shade"></div>
  <div class="brand"><i><b></b><b></b><b></b><b></b></i>AUSSIEWAY</div>
  <div class="txt">
    <div class="kicker">PVT Australie</div>
    <h1>Tu cherches un job en arrivant ?</h1>
    <p><b>Plus de 2 300 employeurs</b> qui embauchent des backpackers, avec leur numéro.</p>
    <div class="link">aussieway.fr <span>→</span></div>
    <div class="hint">Le lien est dans le profil</div>
  </div>
</body></html>
